# OINK documentation site for sseserver-fiber.
title: &siteTitle SSEServer for Fiber
baseURL: https://zwishing.github.io/sseserver-fiber/
defaultContentLanguage: en
disableLanguages: []
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: Asia/Shanghai

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: *siteTitle
    params:
      description: A small, topic-aware Server-Sent Events broker for Fiber v3.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 一个面向 Fiber v3、支持主题路由的轻量 Server-Sent Events 代理。

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: sseserver-fiber contributors
    from_year: 2026
  footer_center_info: ''
  github_repo: https://github.com/zwishing/sseserver-fiber
  github_branch: main
  logo: icons/logo.svg
  ui:
    dark_mode: true
    section_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true
    theme_color: '#2563eb'

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
